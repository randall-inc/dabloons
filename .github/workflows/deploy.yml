name: Deploy

# Every push to main (i.e. every merged PR) ships: Neon migrations ->
# Cloudflare Worker deploy -> npm publish (only when the version is new).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deploys must run serially — never cancel a deploy in progress. Pull
# requests (anyone's, once the repo is public) get their own group per PR, so
# they can never cancel or delay a queued main deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            dashboard/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          (cd web && npm ci)
          (cd dashboard && npm ci)
      - name: No tests allowed
        run: ./scripts/no-tests.sh
      - name: Typecheck CLI
        run: npx tsc -p tsconfig.json --noEmit
      - name: Typecheck worker
        run: cd web && npx tsc -p tsconfig.json
      - name: Build dashboard
        run: cd dashboard && npm run build
      - name: Build CLI
        run: npm run build

  migrate:
    # PRs only run the check job (no secrets); deploys happen on main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Migrate Neon
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending migrations
        env:
          NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: |
          if [ -z "$NEON_DIRECT_URL" ]; then
            echo "::error::NEON_DIRECT_URL secret is not set"
            exit 1
          fi
          for f in shared/schema-pg.sql shared/schema-pg-002.sql shared/schema-pg-003.sql shared/schema-pg-004.sql shared/schema-pg-005.sql shared/schema-pg-006.sql shared/schema-pg-007.sql shared/schema-pg-008.sql shared/schema-pg-009.sql shared/schema-pg-010.sql shared/schema-pg-011.sql shared/schema-pg-012.sql shared/schema-pg-013.sql shared/schema-pg-014.sql shared/schema-pg-015.sql shared/schema-pg-016.sql; do
            echo "--- $f"
            psql "$NEON_DIRECT_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

  deploy-worker:
    # PRs only run the check job (no secrets); deploys happen on main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Deploy worker
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            dashboard/package-lock.json
      - name: Install worker dependencies
        run: cd web && npm ci
      - name: Build dashboard
        run: cd dashboard && npm ci && npm run build
      - name: Deploy to Cloudflare
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  publish-npm:
    # PRs only run the check job (no secrets); deploys happen on main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Publish npm
    needs: deploy-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Publish if version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is not set — skipping npm publish."
            echo "To enable: create a granular Automation token scoped to 'dabloons' (read+write) at npmjs.com, then run:"
            echo "  gh secret set NPM_TOKEN --repo randall-inc/dabloons"
            exit 0
          fi
          LOCAL_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view dabloons version 2>/dev/null || echo "none")
          echo "local=$LOCAL_VER remote=$REMOTE_VER"
          if [ "$LOCAL_VER" = "$REMOTE_VER" ]; then
            echo "Version $LOCAL_VER is already on npm — nothing to publish."
          else
            # Two close pushes can race to publish the same version; already on npm = done.
            npm publish --access public || npm view "dabloons@$LOCAL_VER" version
          fi
